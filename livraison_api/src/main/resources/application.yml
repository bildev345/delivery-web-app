spring:
    application:
        name: api
    config: 
        import: optional:file:.env[.properties]
    datasource:
       url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_NAME}
       username: ${DB_USERNAME}
       password: ${DB_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
            format_sql: true

app: 
    security:
        jwt:
           access-token-expiration : 86400000 # 24 hours 
           refresh-token-expiration: 604800000 # 7 days
           disposable-email: 10minutemail,20minutemail,33mail,5ymail,anonbox,guerrillamail,mailinator,maildrop,mailnesia,moakt,my10minutemail,throwawaymail,trashmail,temp-mail,tempmail,truemail,yopmail
    cookie:
        name: deliverma_jwt
        secure: false
        same-site: Strict
    cors:
        allowed-origins: http://localhost:5173           



