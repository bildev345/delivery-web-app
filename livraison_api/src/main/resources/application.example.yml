spring:
    application:
        name: api
    config: 
        import: optional:file:.env[.properties]
    datasource:
       url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_NAME}
       username: ${DB_USERNAME}
       password: ${DB_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
            format_sql: true

    servlet:
        multipart:
            enabled: true
            max-file-size: 5MB
            max-request-size: 5MB

    mail:
        host : smtp.gmail.com
        port : 587
        username : ton_email@gmail.com  
        password : ton_password  
        properties:
            mail: 
              smtp:
                auth : true
                starttls:
                    enable : true
                    required : true
                connectiontimeout : 5000
                timeout : 5000
                writretimeout : 5000        
            
app: 
    security:
        jwt:
           access-token-expiration : 86400000 # 24 hours 
           refresh-token-expiration: 604800000 # 7 days
        disposable-email: 10minutemail,20minutemail,33mail,5ymail,anonbox,guerrillamail,mailinator,maildrop,mailnesia,moakt,my10minutemail,throwawaymail,trashmail,temp-mail,tempmail,truemail,yopmail
    cookie:
        name: cookie name
        secure: false
        same-site: Strict
    cors:
        allowed-origins: http://localhost:5173  
    mail:
        from : DeliverMa <ton_email@gmail.com>     
    

cloudinary:
    cloud-name : cloud name
    api-key: api key
    api-secret: api secret
    upload-preset : upload-preset



